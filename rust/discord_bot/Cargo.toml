[package]
name = "discord_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
dotenvy = "0.15.7"
poise = "0.7.0"
rand = "0.10.2"
reqwest = "0.12"
rusty_ytdl = "0.7.4"
serde = "1.0.229"
serde_json = "1.0.151"
serenity = { features = ["cache", "framework", "standard_framework", "voice", "http", "rustls_backend"], version = "0.12" }
songbird = { version = "0.6.0", features = ["serenity"]}
symphonia = { features = ["aac", "mp3", "isomp4", "alac"], version = "0.5.2" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
